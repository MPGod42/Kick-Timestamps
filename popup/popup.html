<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Timestamps</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
        }
        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .setting:last-child {
            border-bottom: none;
        }
        .setting-label {
            font-size: 14px;
            color: #555;
        }
        .toggle {
            width: 50px;
            height: 24px;
            border-radius: 12px;
            background: #ccc;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            border: none;
            padding: 0;
        }
        .toggle.enabled {
            background: #4CAF50;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .toggle.enabled::after {
            left: 28px;
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .button-group button {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            transition: background 0.2s, border-color 0.2s;
        }
        .button-group button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        #fileInput {
            display: none;
        }
        .status-message {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../assets/logo.png" alt="Kick Timestamps Logo" style="width: 32px; height: 32px; display: block; margin: 0 auto 10px;">
        <h2>Settings</h2>
        <div class="setting">
            <span class="setting-label">Debug Logging</span>
            <button id="debugToggle" class="toggle" title="Toggle debug logging on/off"></button>
        </div>
        <div class="button-group">
            <button id="exportBtn" title="Download your VOD timestamps">📥 Export</button>
            <button id="importBtn" title="Import VOD timestamps from file">📤 Import</button>
            <input type="file" id="fileInput" accept=".json" />
        </div>
        <div id="statusMessage" class="status-message"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
